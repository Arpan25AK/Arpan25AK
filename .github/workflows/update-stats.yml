name: Update README cards
on:
  schedule:
    - cron: "30 9 * * *"   # runs once daily at 3:00 PM IST (9:30 AM UTC)
  workflow_dispatch:        # lets you trigger it manually too
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card (includes private commits)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=Arpan25AK&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true'
          path: profile/stats.svg
          token: ${{ secrets.PAT_1 }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=Arpan25AK&layout=compact&theme=tokyonight&hide_border=true&langs_count=8'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet || git commit -m "chore: update stats cards"
          git push
